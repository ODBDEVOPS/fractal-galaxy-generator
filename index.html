    <style>
        :root {
            --cyan-glow: rgba(6, 182, 212, 0.5);
            --amber-glow: rgba(245, 158, 11, 0.5);
            --void-bg: #02040a;
        }
        body {
            background-color: var(--void-bg);
            color: #e2e8f0;
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }

        /* Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, transparent, rgba(6, 182, 212, 0.05), transparent);
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            animation: scanline 8s linear infinite;
            z-index: 100;
        }

        .glow-cyan { filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        .glow-amber { filter: drop-shadow(0 0 8px var(--amber-glow)); }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }

        @keyframes dash {
          to {
            stroke-dashoffset: -100;
          }
        }

        .animate-spin-slow {
          animation: spin 8s linear infinite;
        }

        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
    </style>
